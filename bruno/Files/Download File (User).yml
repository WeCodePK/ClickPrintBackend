info:
  name: Download File (User)
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/files/:fileId"
  params:
    - name: fileId
      value: ""
      type: path
  headers:
    - name: Accept
      value: application/pdf
      disabled: true
    - name: Range
      value: bytes=0-1023
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
