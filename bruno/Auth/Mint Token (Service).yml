info:
  name: Mint Token (Service)
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/auth/mint"
  body:
    type: json
    data: |-
      {
        "number": "923235400291"
      }
  auth:
    type: apikey
    key: Authorization
    value: ApiKey {{SERVICE_KEY}}
    placement: header

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        if (data && data.success && data.data && data.data.token)
          bru.setVar("token", data.data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
