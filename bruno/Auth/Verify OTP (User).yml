info:
  name: Verify OTP (User)
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/auth/verify"
  body:
    type: json
    data: |-
      {
        "code": "61419",
        "number": "{{number}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.success) {
          bru.setVar("token", body.data.token);
          bru.setVar("userId", body.data.user._id);  
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
