info:
  name: Create Draft (User)
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/drafts"
  body:
    type: json
    data: |-
      {
        "shop": "6a77e7500842b630acec5b52",
        "files": [
          {
            "file": "1b8a329b-0ea5-4c66-9abd-ef46e75922fd",
            "settings": {
              "color": false,
              "pageType": "A4",
              "pagesPerSheet": 1,
              "numberOfCopies": 1,
              "sidedness": "none",
              "pageSelection": "",
              "orientation": "portrait"
            }
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body?.success && body?.data?.draft?._id) {
          bru.setVar("draftId", body.data.draft._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
