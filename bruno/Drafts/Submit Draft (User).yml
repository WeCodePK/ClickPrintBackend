info:
  name: Submit Draft (User)
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{host}}/api/drafts/:draftId/submit"
  params:
    - name: draftId
      value: "{{draftId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body?.success && body?.data?.job?._id) {
          bru.setVar("jobId", body.data.job._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
