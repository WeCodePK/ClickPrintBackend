info:
  name: Check Draft
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{host}}/api/drafts/:draftId/check"
  params:
    - name: draftId
      value: "{{draftId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
