info:
  name: List My Drafts
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/drafts/user/:userId"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
